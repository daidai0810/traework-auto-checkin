name: TraeWork Daily Checkin

on:
  schedule:
    # 每天 UTC 0:00 运行 = 北京时间 8:00
    - cron: '0 0 * * *'
  
  # 支持手动触发
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    name: TraeWork 每日签到
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run checkin script
        env:
          TRAE_ACCESS_TOKEN: ${{ secrets.TRAE_ACCESS_TOKEN }}
          TRAE_DEVICE_ID: ${{ secrets.TRAE_DEVICE_ID }}
          TRAE_REGION: ${{ secrets.TRAE_REGION }}
        run: |
          python scripts/checkin.py
      
      - name: Send notification on failure
        if: failure()
        run: |
          echo "签到失败，请检查 token 是否过期！"
