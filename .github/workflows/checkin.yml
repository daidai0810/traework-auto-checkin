name: TraeWork Daily Checkin

on:
  schedule:
    # 多重保险：北京时间 08:00 / 09:00 / 10:00 / 11:00 各尝试一次
    # （UTC = 北京时间 - 8 小时，即 UTC 00:00 / 01:00 / 02:00 / 03:00）
    # 已签到时会自动跳过，不会重复领取
    - cron: '0 0,1,2,3 * * *'

  # 支持手动触发
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    name: TraeWork 每日签到
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run checkin script
        env:
          TRAE_ACCESS_TOKEN: ${{ secrets.TRAE_ACCESS_TOKEN }}
          TRAE_DEVICE_ID: ${{ secrets.TRAE_DEVICE_ID }}
          TRAE_REGION: ${{ secrets.TRAE_REGION }}
        run: |
          python scripts/checkin.py
      
      - name: Send notification on failure
        if: failure()
        run: |
          echo "签到失败，请检查 token 是否过期！"
